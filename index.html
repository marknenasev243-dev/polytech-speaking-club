<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Polytech Speaking Club · Московский Политех</title>
 
<link rel="stylesheet" href="./style.css?v=resilience-20261124-1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./winter-theme-toggle.js?v=resilience-20261124-1" defer></script>

<style>
    /* Только стартовый экран: исчезает автоматически, когда app.js заменяет #app */
    #app > .psc-loading {
      min-height: min(75vh, 760px);
      min-height: min(75dvh, 760px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      text-align: center;
      background: #fff;
      color: #161b22;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    .psc-loading-wheel {
      position: relative;
      display: grid;
      place-items: center;
      width: 166px;
      height: 166px;
      isolation: isolate;
    }
    .psc-loading-wheel::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, #141414 0deg 4deg, transparent 4deg 11deg);
      -webkit-mask: radial-gradient(farthest-side, transparent 78%, #000 80%, #000 92%, transparent 94%);
      mask: radial-gradient(farthest-side, transparent 78%, #000 80%, #000 92%, transparent 94%);
      animation: psc-wheel-spin 1.75s linear infinite;
    }
    .psc-loading-logo {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }
    .psc-loading-caption {
      font-size: 15px;
      font-weight: 500;
      color: #747a83;
      letter-spacing: 0.01em;
    }
    @keyframes psc-wheel-spin {to {transform: rotate(360deg);}}
    @media (prefers-reduced-motion: reduce) {
      .psc-loading-wheel::before {animation: none;}
    }
    /* Предупреждение о качестве связи — отдельно от общих стеклянных стилей. */
    #app .psc-connection-warning {
      box-sizing: border-box;
      width: 100%;
      margin: 0 0 12px;
      padding: 10px 13px;
      border: 1px solid #d9aa4d;
      border-radius: 13px;
      background: rgba(255, 244, 208, .95);
      color: #69460d;
      box-shadow: 0 3px 12px rgba(89, 60, 8, .12);
      font-size: 12px;
      line-height: 1.4;
      text-align: left;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    #app .psc-connection-warning strong {display:block;font-size:14px;margin-bottom:3px;}
    #app .psc-connection-warning span {display:block;}
    html[data-winter-theme="dark"] #app .psc-connection-warning {
      background: rgba(65, 49, 28, .94);
      border-color: #cda35a;
      color: #ffe9b7;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="psc-loading" role="status" aria-live="polite" aria-label="Загружаем Speaking Club">
      <div class="psc-loading-wheel" aria-hidden="true">
        <img class="psc-loading-logo" src="./mospolytech-loader.png" alt="">
      </div>
      <div class="psc-loading-caption">Загружаем Speaking Club…</div>
    </div>
  </div>

<script>
  let loadingError = '';

  window.addEventListener('error', function (event) {
    loadingError = event.message || 'Ошибка JavaScript';
  });

  window.addEventListener('unhandledrejection', function (event) {
    loadingError = String(
      event.reason?.message || event.reason
    );
  });

  setTimeout(function () {
    const loading = document.querySelector('#app > .psc-loading');

    if (loading) {
      loading.innerHTML = `
        <div style="padding:24px;text-align:center">
          <h2>Не удалось запустить приложение</h2>
          <p>Причина: <span id="psc-error-message"></span></p>
          Попробуйте зайти ещё раз
        </div>
      `;

      document.getElementById('psc-error-message').textContent =
        loadingError || 'JavaScript не запустился или сервер не ответил';
    }
  }, 32000);
</script>
<script type="module" src="./app.js?v=connection-20261124-2"></script>

</body>
</html>
