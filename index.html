<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Polytech Speaking Club · Московский Политех</title>
 


<link rel="stylesheet" href="./style.css?v=glass-ui-2">



  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
<script type="module" src="./app.js?v=search-fix-4"></script>

  <style>
    /* Только стартовый экран: исчезает автоматически, когда app.js заменяет #app */
    #app > .psc-loading {
      min-height: min(75vh, 760px);
      min-height: min(75dvh, 760px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      text-align: center;
      background: #fff;
      color: #161b22;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    .psc-loading-wheel {
      position: relative;
      display: grid;
      place-items: center;
      width: 166px;
      height: 166px;
      isolation: isolate;
    }
    .psc-loading-wheel::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, #141414 0deg 4deg, transparent 4deg 11deg);
      -webkit-mask: radial-gradient(farthest-side, transparent 78%, #000 80%, #000 92%, transparent 94%);
      mask: radial-gradient(farthest-side, transparent 78%, #000 80%, #000 92%, transparent 94%);
      animation: psc-wheel-spin 1.75s linear infinite;
    }
    .psc-loading-logo {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }
    .psc-loading-caption {
      font-size: 15px;
      font-weight: 500;
      color: #747a83;
      letter-spacing: 0.01em;
    }
    @keyframes psc-wheel-spin {to {transform: rotate(360deg);}}
    @media (prefers-reduced-motion: reduce) {
      .psc-loading-wheel::before {animation: none;}
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="psc-loading" role="status" aria-live="polite" aria-label="Загружаем Speaking Club">
      <div class="psc-loading-wheel" aria-hidden="true">
        <img class="psc-loading-logo" src="./mospolytech-loader.png" alt="">
      </div>
      <div class="psc-loading-caption">Загружаем Speaking Club…</div>
    </div>
  </div>

<script>
  let loadingError = '';

  window.addEventListener('error', function (event) {
    loadingError = event.message || 'Ошибка JavaScript';
  });

  window.addEventListener('unhandledrejection', function (event) {
    loadingError = String(
      event.reason?.message || event.reason
    );
  });

  setTimeout(function () {
    const loading = document.querySelector('#app > .psc-loading');

    if (loading) {
      loading.innerHTML = `
        <div style="padding:24px;text-align:center">
          <h2>Не удалось запустить приложение</h2>
          <p>Причина: <span id="psc-error-message"></span></p>
          Попробуйте зайти ещё раз
        </div>
      `;

      document.getElementById('psc-error-message').textContent =
        loadingError || 'JavaScript не запустился или сервер не ответил';
    }
  }, 12000);
</script>

<script src="./winter-theme-toggle.js?v=star-scroll-v2" defer></script>




</body>
</html>
